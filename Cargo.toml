cargo-features = ["panic-immediate-abort"]

[package]
name = "beacon-on-tab5"
version = "0.1.0"
edition = "2024"
resolver = "2"
rust-version = "1.97"

[[bin]]
name = "beacon-on-tab5"
path = "src/main.rs"
harness = false

[features]
# Diagnostic: after each SSTV transmission, dump the exact PCM sample stream
# over the USB port so the digital and acoustic paths can be compared.
usb-audio-dump = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "immediate-abort"

[profile.dev]
debug = true
strip = "debuginfo"
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git", rev = "eaf69b2ae2a3b0816346c51ea326634b5d3dc88b" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git", rev = "24e99b865a0ffc87dcb4f4142fb06daeb9481c89" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git", rev = "79dd63480a73a4ff11a49a5df95024bd85cd3912" }

[dependencies]
beacon = { path = "../beacon" }
embedded-hal = "1"
log = "0.4"
sstv = { version = "0.1", default-features = false }
esp-idf-sys = "0.37"
esp-idf-hal = "0.46"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
